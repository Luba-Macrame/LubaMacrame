<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Macramé</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #8b5cf6; --bg: #f9fafb; --card: #ffffff; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { margin: 0; color: #1f2937; }
        p { color: #6b7280; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 15px; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        .price { font-weight: bold; color: var(--primary); font-size: 1.2rem; }
        .admin-panel { max-width: 600px; margin: 0 auto 40px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { opacity: 0.9; }
        .delete-btn { background: #ef4444; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <h1 id="site-title">Tú Tienda de Macramé</h1>
        <p id="site-subtitle">NUDO A NUDO, TEJEMOS HISTORIAS PARA TI</p>
    </header>

    <!-- Panel para agregar productos directamente a Supabase -->
    <div class="admin-panel">
        <h3>➕ Añadir Nuevo Producto (Nube)</h3>
        <form id="product-form">
            <div class="form-group">
                <label>Nombre del producto</label>
                <input type="text" id="p-title" required placeholder="Ej. Tapiz Hoja">
            </div>
            <div class="form-group">
                <label>Precio (€)</label>
                <input type="number" step="0.01" id="p-price" required placeholder="25.00">
            </div>
            <div class="form-group">
                <label>URL de la imagen (Directa de ImgBB)</label>
                <input type="url" id="p-image" required placeholder="https://i.ibb.co/xxxx/foto.png">
            </div>
            <button type="submit">Guardar en la Nube</button>
        </form>
    </div>

    <!-- Catálogo de productos -->
    <div class="grid" id="products-container">
        <p>Cargando productos desde Supabase...</p>
    </div>

    <script>
        // Inicialización de Supabase con tus credenciales
        const SUPABASE_URL = 'https://vgxfitexnkvjijkamdcg.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_MtWly2tb9B_XdQrIWpau6g_VR-F-bS_';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Elementos del DOM
        const container = document.getElementById('products-container');
        const form = document.getElementById('product-form');

        // 1. Cargar productos desde Supabase al iniciar
        async function fetchProducts() {
            const { data, error } = await db.from('productos').select('*').order('created_at', { ascending: false });
            
            if (error) {
                console.error('Error al cargar:', error);
                container.innerHTML = '<p>Error al conectar con la base de datos.</p>';
                return;
            }

            if (data.length === 0) {
                container.innerHTML = '<p>No hay productos guardados aún.</p>';
                return;
            }

            container.innerHTML = data.map(p => `
                <div class="card">
                    <img src="${p.image}" alt="${p.title}" onerror="this.src='https://via.placeholder.com/200'">
                    <h3>${p.title}</h3>
                    <p class="price">${p.price} €</p>
                    <button class="delete-btn" onclick="deleteProduct(${p.id})">Eliminar</button>
                </div>
            `).join('');
        }

        // 2. Guardar nuevo producto en la nube
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('p-title').value;
            const price = parseFloat(document.getElementById('p-price').value);
            const image = document.getElementById('p-image').value;

            const { error } = await db.from('productos').insert([{ title, price, image }]);

            if (error) {
                alert('Error al guardar el producto: ' + error.message);
            } else {
                form.reset();
                fetchProducts();
            }
        });

        // 3. Eliminar producto de la nube
        async function deleteProduct(id) {
            if (!confirm('¿Seguro que quieres borrar este producto?')) return;
            const { error } = await db.from('productos').delete().eq('id', id);
            
            if (error) {
                alert('Error al eliminar: ' + error.message);
            } else {
                fetchProducts();
            }
        }

        // Carga inicial
        fetchProducts();
    </script>
</body>
</html>
